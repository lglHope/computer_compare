# cgroup.conf
# Slurm 25.x cgroup 配置（CentOS 7/cgroup v1）
# 注意：Slurm 25.x 移除了部分旧参数，此配置已适配

CgroupMountpoint=/sys/fs/cgroup

# 资源约束
ConstrainCores=yes
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes
ConstrainDevices=yes

# 内存配置
AllowedRAMSpace=100
AllowedSwapSpace=0
MaxRAMPercent=100
MaxSwapPercent=0
MinRAMSpace=30

# 注意：Slurm 25+ 中以下参数已移除：
# - CgroupAutomount=yes （自动处理）
# - OOMKill=yes （默认行为）
# - TaskAffinity=yes （由task/affinity插件处理）
# - ConstrainKmemSpace= （已废弃）
