# slurm.conf
# Slurm 25.11.x 配置文件 - EDA/OPC/Mask计算集群
# 适用于：CentOS 7/8/9，Slurm 25.x
# 注意：init-slurm.sh脚本会自动修改 SlurmctldHost 和 NodeName 配置
# =============================================================================

# =============================================================================
# 集群基础
# =============================================================================
ClusterName=edacluster
SlurmctldHost=MASTER_HOST_PLACEHOLDER

# =============================================================================
# 认证与进程跟踪
# =============================================================================
AuthType=auth/munge
CryptoType=crypto/munge
CredType=cred/munge
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
UsePAM=0

# =============================================================================
# 调度器
# =============================================================================
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
ReturnToService=2

# =============================================================================
# 超时
# =============================================================================
SlurmctldTimeout=120
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
BatchStartTimeout=60
TCPTimeout=60

# =============================================================================
# 日志与路径
# =============================================================================
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid

# =============================================================================
# 记账（暂用none，slurmdbd需要MariaDB 10.0.5+）
# CentOS7自带MariaDB 5.5不支持REGEXP_REPLACE，升级后可改为accounting_storage/slurmdbd
# =============================================================================
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/none

# =============================================================================
# 计算节点（init-slurm.sh会通过 slurmd -C 自动检测硬件并添加节点）
# =============================================================================
# NodeName行将由脚本自动追加

# =============================================================================
# 分区
# =============================================================================
PartitionName=normal Nodes=ALL Default=YES MaxTime=7-0 State=UP OverSubscribe=NO
