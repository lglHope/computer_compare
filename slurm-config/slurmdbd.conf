# slurmdbd.conf
# Slurm 25.x 数据库记账服务配置
AuthType=auth/munge
DbdHost=localhost
DbdPort=6819

StorageType=accounting_storage/mysql
StorageHost=localhost
StoragePort=3306
StorageLoc=slurm_acct_db
StorageUser=slurm
StoragePass=slurmpass_2026

# Slurm 25.x 参数名：DebugLevel/LogFile/PidFile（不带Slurmdbd前缀）
DebugLevel=info
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/var/run/slurmdbd.pid
